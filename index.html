<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь смен</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .calendar {
            width: 380px;
            max-width: 100%;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* ШАПКА */

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 22px;
            text-align: center;
        }

        .arrow {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border: none;
            border-radius: 10px;
            background: #f0f0f0;
            font-size: 22px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .arrow:hover {
            background: #ddd;
        }

        /* КАЛЕНДАРЬ */

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 4px;
        }

        .weekdays {
            margin-bottom: 6px;
        }

        .weekday {
            text-align: center;
            font-size: 13px;
            color: #888;
            font-weight: bold;
        }

        .day {
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            color: #333;
            transition: filter 0.2s;
        }

        /* ЦВЕТА СМЕН */

        /* Утренняя */
        .shift-morning {
            background: #bbf7d0;
            color: #166534;
        }

        /* Ночная */
        .shift-night {
            background: #bfdbfe;
            color: #1e3a8a;
        }

        /* Обеденная */
        .shift-lunch {
            background: #fed7aa;
            color: #9a3412;
        }

        /* Сегодня */

        .today {
            outline: 3px solid #111827;
            font-weight: bold;
        }

        /* ЛЕГЕНДА */

        .legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }

        .legend-morning {
            background: #bbf7d0;
        }

        .legend-night {
            background: #bfdbfe;
        }

        .legend-lunch {
            background: #fed7aa;
        }

        @media (max-width: 400px) {
            .calendar {
                padding: 14px;
            }

            .day {
                height: 40px;
            }

            .calendar-header h2 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div class="calendar">

    <!-- ШАПКА -->

    <div class="calendar-header">
        <button class="arrow" id="prev" aria-label="Предыдущий месяц">
            ←
        </button>

        <h2 id="monthYear"></h2>

        <button class="arrow" id="next" aria-label="Следующий месяц">
            →
        </button>
    </div>

    <!-- ДНИ НЕДЕЛИ -->

    <div class="weekdays">
        <div class="weekday">Пн</div>
        <div class="weekday">Вт</div>
        <div class="weekday">Ср</div>
        <div class="weekday">Чт</div>
        <div class="weekday">Пт</div>
        <div class="weekday">Сб</div>
        <div class="weekday">Вс</div>
    </div>

    <!-- ДНИ МЕСЯЦА -->

    <div class="days" id="days"></div>

    <!-- ЛЕГЕНДА -->

    <div class="legend" id="legend"></div>

</div>

<script>
    const monthYear = document.getElementById("monthYear");
    const daysContainer = document.getElementById("days");
    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");
    const legend = document.getElementById("legend");

    const months = [
        "Январь",
        "Февраль",
        "Март",
        "Апрель",
        "Май",
        "Июнь",
        "Июль",
        "Август",
        "Сентябрь",
        "Октябрь",
        "Ноябрь",
        "Декабрь"
    ];

    /*
        ЦИКЛ СМЕН:

        Утренняя → Ночная → Обеденная

        Смена автоматически определяется
        по текущей неделе и повторяется
        каждые три недели.
    */

    const shifts = [
        {
            id: "morning",
            name: "Утренняя",
            className: "shift-morning"
        },
        {
            id: "night",
            name: "Ночная",
            className: "shift-night"
        },
        {
            id: "lunch",
            name: "Обеденная",
            className: "shift-lunch"
        }
    ];

    /*
        НАСТРОЙКА ЦИКЛА

        Здесь задаётся смена текущей недели.

        0 — утренняя
        1 — ночная
        2 — обеденная

        По умолчанию установлена утренняя.
    */

    const currentWeekShiftIndex = 0;

    let currentDate = new Date();

    const today = new Date();

    /*
        Получение понедельника недели.
    */

    function getMonday(date) {
        const result = new Date(
            date.getFullYear(),
            date.getMonth(),
            date.getDate()
        );

        const day = result.getDay();

        const difference = day === 0 ? -6 : 1 - day;

        result.setDate(result.getDate() + difference);
        result.setHours(0, 0, 0, 0);

        return result;
    }

    /*
        Понедельник текущей недели.
    */

    const currentWeek = getMonday(today);

    /*
        Разница между двумя неделями.
    */

    function getWeekDifference(firstWeek, secondWeek) {
        const difference =
            firstWeek.getTime() - secondWeek.getTime();

        return Math.round(
            difference / (1000 * 60 * 60 * 24 * 7)
        );
    }

    /*
        Определение смены для любой даты.
    */

    function getShiftForDate(date) {
        const week = getMonday(date);

        const weekDifference = getWeekDifference(
            week,
            currentWeek
        );

        const shiftIndex =
            (
                currentWeekShiftIndex +
                weekDifference % shifts.length +
                shifts.length
            ) % shifts.length;

        return shifts[shiftIndex];
    }

    /*
        ОТРИСОВКА ЛЕГЕНДЫ.
    */

    function renderLegend() {
        legend.innerHTML = "";

        shifts.forEach(shift => {
            const item = document.createElement("div");
            item.className = "legend-item";

            const color = document.createElement("div");
            color.className = "legend-color";

            color.classList.add(
                `legend-${shift.id}`
            );

            const name = document.createElement("span");
            name.textContent = shift.name;

            item.appendChild(color);
            item.appendChild(name);

            legend.appendChild(item);
        });
    }

    /*
        ОТРИСОВКА КАЛЕНДАРЯ.
    */

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        monthYear.textContent = `${months[month]} ${year}`;

        daysContainer.innerHTML = "";

        /*
            День недели первого числа месяца.
            Понедельник = 1, воскресенье = 7.
        */

        let firstDay = new Date(year, month, 1).getDay();

        if (firstDay === 0) {
            firstDay = 7;
        }

        /*
            Пустые клетки перед первым числом.
            Даты предыдущего месяца не показываются.
        */

        for (let i = 1; i < firstDay; i++) {
            const emptyDay = document.createElement("div");
            emptyDay.className = "day";

            daysContainer.appendChild(emptyDay);
        }

        /*
            Количество дней текущего месяца.
        */

        const daysInMonth = new Date(
            year,
            month + 1,
            0
        ).getDate();

        /*
            Создаём дни месяца и окрашиваем
            их в цвет соответствующей смены.
        */

        for (let day = 1; day <= daysInMonth; day++) {
            const dayElement = document.createElement("div");

            dayElement.className = "day";
            dayElement.textContent = day;

            const date = new Date(year, month, day);
            const shift = getShiftForDate(date);

            dayElement.classList.add(shift.className);
            dayElement.title = shift.name;

            /*
                Выделяем сегодняшний день.
            */

            if (
                day === today.getDate() &&
                month === today.getMonth() &&
                year === today.getFullYear()
            ) {
                dayElement.classList.add("today");
            }

            daysContainer.appendChild(dayElement);
        }
    }

    /*
        ПРЕДЫДУЩИЙ МЕСЯЦ.
    */

    prevButton.addEventListener("click", () => {
        currentDate = new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() - 1,
            1
        );

        renderCalendar();
    });

    /*
        СЛЕДУЮЩИЙ МЕСЯЦ.
    */

    nextButton.addEventListener("click", () => {
        currentDate = new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() + 1,
            1
        );

        renderCalendar();
    });

    /*
        ЗАПУСК.
    */

    renderLegend();
    renderCalendar();
</script>

</body>
</html>
