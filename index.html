<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь смен</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .calendar {
            width: 380px;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .arrow {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            background: #f0f0f0;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .arrow:hover {
            background: #ddd;
        }

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .weekdays {
            margin-bottom: 6px;
        }

        .weekday {
            text-align: center;
            font-size: 13px;
            color: #888;
            font-weight: bold;
        }

        .day {
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            color: #333;
        }

        .day:hover {
            filter: brightness(0.93);
        }

        /* =========================
           ЦВЕТА СМЕН
           ========================= */

        /* Обеденная */
        .shift-lunch {
            background: #fed7aa;
            color: #9a3412;
        }

        /* Утренняя */
        .shift-morning {
            background: #bbf7d0;
            color: #166534;
        }

        /* Ночная */
        .shift-night {
            background: #bfdbfe;
            color: #1e3a8a;
        }

        /* Сегодня */
        .today {
            outline: 3px solid #111827;
            font-weight: bold;
        }

        .empty {
            cursor: default;
            background: transparent !important;
        }

        .empty:hover {
            filter: none;
        }

        /* Легенда */
        .legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }

        .legend-lunch {
            background: #fed7aa;
        }

        .legend-morning {
            background: #bbf7d0;
        }

        .legend-night {
            background: #bfdbfe;
        }
    </style>
</head>

<body>

<div class="calendar">

    <div class="calendar-header">
        <button class="arrow" id="prev">←</button>

        <h2 id="monthYear"></h2>

        <button class="arrow" id="next">→</button>
    </div>

    <div class="weekdays">
        <div class="weekday">Пн</div>
        <div class="weekday">Вт</div>
        <div class="weekday">Ср</div>
        <div class="weekday">Чт</div>
        <div class="weekday">Пт</div>
        <div class="weekday">Сб</div>
        <div class="weekday">Вс</div>
    </div>

    <div class="days" id="days"></div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-color legend-lunch"></div>
            Обеденная
        </div>

        <div class="legend-item">
            <div class="legend-color legend-morning"></div>
            Утренняя
        </div>

        <div class="legend-item">
            <div class="legend-color legend-night"></div>
            Ночная
        </div>
    </div>

</div>


<script>

    const monthYear = document.getElementById("monthYear");
    const daysContainer = document.getElementById("days");

    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");


    let currentDate = new Date();


    const months = [
        "Январь",
        "Февраль",
        "Март",
        "Апрель",
        "Май",
        "Июнь",
        "Июль",
        "Август",
        "Сентябрь",
        "Октябрь",
        "Ноябрь",
        "Декабрь"
    ];


    /*
        ==========================================
        НАСТРОЙКА ЦИКЛА СМЕН
        ==========================================

        24 августа 2026 = Обеденная
        31 августа 2026 = Утренняя
        7 сентября 2026 = Ночная

        Затем цикл повторяется.
    */

    const shiftStart = new Date(2026, 7, 24);

    const shifts = [
        {
            name: "Обеденная",
            className: "shift-lunch"
        },
        {
            name: "Утренняя",
            className: "shift-morning"
        },
        {
            name: "Ночная",
            className: "shift-night"
        }
    ];


    /*
        Получаем понедельник недели,
        к которой относится дата.
    */
    function getMonday(date) {

        const result = new Date(date);

        const day = result.getDay();

        const difference = day === 0 ? -6 : 1 - day;

        result.setDate(result.getDate() + difference);

        result.setHours(0, 0, 0, 0);

        return result;
    }


    /*
        Определяем смену для конкретной недели.
    */
    function getShiftForDate(date) {

        const monday = getMonday(date);

        const startMonday = getMonday(shiftStart);

        // Разница между неделями в миллисекундах
        const difference =
            monday.getTime() - startMonday.getTime();

        // Количество полных недель
        const weeks =
            Math.round(
                difference / (1000 * 60 * 60 * 24 * 7)
            );

        // Получаем номер смены 0, 1 или 2
        const shiftIndex =
            ((weeks % shifts.length) + shifts.length)
            % shifts.length;

        return shifts[shiftIndex];
    }


    function renderCalendar() {

        const year = currentDate.getFullYear();

        const month = currentDate.getMonth();


        // Название месяца
        monthYear.textContent =
            `${months[month]} ${year}`;


        // Очищаем календарь
        daysContainer.innerHTML = "";


        /*
            Первый день месяца
        */
        let firstDay =
            new Date(year, month, 1).getDay();


        // Делаем понедельник первым днем
        if (firstDay === 0) {
            firstDay = 7;
        }


        /*
            Количество дней в месяце
        */
        const daysInMonth =
            new Date(year, month + 1, 0).getDate();


        /*
            Пустые клетки перед первым днем
        */
        for (let i = 1; i < firstDay; i++) {

            const emptyDay =
                document.createElement("div");

            emptyDay.classList.add(
                "day",
                "empty"
            );

            daysContainer.appendChild(emptyDay);
        }


        /*
            Создаём дни
        */
        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const dayElement =
                document.createElement("div");


            dayElement.classList.add("day");

            dayElement.textContent = day;


            /*
                Создаём полноценную дату
            */
            const date =
                new Date(year, month, day);


            /*
                Получаем смену этой недели
            */
            const shift =
                getShiftForDate(date);


            /*
                Добавляем цвет смены
            */
            dayElement.classList.add(
                shift.className
            );


            /*
                Проверяем сегодняшний день
            */
            const today = new Date();


            if (
                day === today.getDate() &&
                month === today.getMonth() &&
                year === today.getFullYear()
            ) {

                dayElement.classList.add("today");
            }


            /*
                При наведении можно посмотреть смену
            */
            dayElement.title =
                shift.name;


            daysContainer.appendChild(
                dayElement
            );
        }
    }


    /*
        Предыдущий месяц
    */
    prevButton.addEventListener(
        "click",
        () => {

            currentDate.setMonth(
                currentDate.getMonth() - 1
            );

            renderCalendar();
        }
    );


    /*
        Следующий месяц
    */
    nextButton.addEventListener(
        "click",
        () => {

            currentDate.setMonth(
                currentDate.getMonth() + 1
            );

            renderCalendar();
        }
    );


    /*
        Первый запуск
    */
    renderCalendar();

</script>

</body>
</html>
