<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь смен</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .calendar {
            width: 380px;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* =========================
           НАСТРОЙКИ
           ========================= */

        .settings {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        .setting {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .setting label {
            font-size: 12px;
            color: #888;
            font-weight: bold;
        }

        .setting select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            outline: none;
        }

        .setting select:focus {
            border-color: #999;
        }

        /* =========================
           ШАПКА
           ========================= */

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .arrow {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            background: #f0f0f0;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .arrow:hover {
            background: #ddd;
        }

        /* =========================
           КАЛЕНДАРЬ
           ========================= */

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .weekdays {
            margin-bottom: 6px;
        }

        .weekday {
            text-align: center;
            font-size: 13px;
            color: #888;
            font-weight: bold;
        }

        .day {
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            color: #333;
        }

        .day:hover {
            filter: brightness(0.93);
        }

        /* =========================
           ЦВЕТА СМЕН
           ========================= */

        /* Обеденная */
        .shift-lunch {
            background: #fed7aa;
            color: #9a3412;
        }

        /* Утренняя */
        .shift-morning {
            background: #bbf7d0;
            color: #166534;
        }

        /* Ночная */
        .shift-night {
            background: #bfdbfe;
            color: #1e3a8a;
        }

        /* Сегодня */
        .today {
            outline: 3px solid #111827;
            font-weight: bold;
        }

        /* =========================
           ЛЕГЕНДА
           ========================= */

        .legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }

        .legend-lunch {
            background: #fed7aa;
        }

        .legend-morning {
            background: #bbf7d0;
        }

        .legend-night {
            background: #bfdbfe;
        }
    </style>
</head>

<body>

<div class="calendar">

    <!-- НАСТРОЙКИ -->

    <div class="settings">

        <div class="setting">
            <label for="shiftCount">
                Количество смен
            </label>

            <select id="shiftCount">
                <option value="2">2 смены</option>
                <option value="3">3 смены</option>
            </select>
        </div>

        <div class="setting">
            <label for="currentShift">
                Смена текущей недели
            </label>

            <select id="currentShift"></select>
        </div>

    </div>


    <!-- ШАПКА -->

    <div class="calendar-header">

        <button class="arrow" id="prev">
            ←
        </button>

        <h2 id="monthYear"></h2>

        <button class="arrow" id="next">
            →
        </button>

    </div>


    <!-- ДНИ НЕДЕЛИ -->

    <div class="weekdays">

        <div class="weekday">Пн</div>
        <div class="weekday">Вт</div>
        <div class="weekday">Ср</div>
        <div class="weekday">Чт</div>
        <div class="weekday">Пт</div>
        <div class="weekday">Сб</div>
        <div class="weekday">Вс</div>

    </div>


    <!-- ДНИ -->

    <div class="days" id="days"></div>


    <!-- ЛЕГЕНДА -->

    <div class="legend" id="legend"></div>

</div>


<script>

    const monthYear =
        document.getElementById("monthYear");

    const daysContainer =
        document.getElementById("days");

    const prevButton =
        document.getElementById("prev");

    const nextButton =
        document.getElementById("next");

    const shiftCountSelect =
        document.getElementById("shiftCount");

    const currentShiftSelect =
        document.getElementById("currentShift");

    const legend =
        document.getElementById("legend");


    /*
        ==========================================
        МЕСЯЦЫ
        ==========================================
    */

    const months = [
        "Январь",
        "Февраль",
        "Март",
        "Апрель",
        "Май",
        "Июнь",
        "Июль",
        "Август",
        "Сентябрь",
        "Октябрь",
        "Ноябрь",
        "Декабрь"
    ];


    /*
        ==========================================
        СМЕНЫ
        ==========================================

        3 смены:

        Утренняя → Ночная → Обеденная

        2 смены:

        Утренняя → Обеденная
    */

    const shiftSets = {

        3: [
            {
                id: "morning",
                name: "Утренняя",
                className: "shift-morning"
            },

            {
                id: "night",
                name: "Ночная",
                className: "shift-night"
            },

            {
                id: "lunch",
                name: "Обеденная",
                className: "shift-lunch"
            }
        ],

        2: [
            {
                id: "morning",
                name: "Утренняя",
                className: "shift-morning"
            },

            {
                id: "lunch",
                name: "Обеденная",
                className: "shift-lunch"
            }
        ]

    };


    /*
        ==========================================
        LOCAL STORAGE
        ==========================================
    */

    const storageKey =
        "shift-calendar-settings-v2";


    let savedSettings = {};

    try {

        savedSettings =
            JSON.parse(
                localStorage.getItem(storageKey) || "{}"
            );

    } catch (error) {

        savedSettings = {};

    }


    /*
        Количество смен
    */

    let shiftCount =
        Number(savedSettings.shiftCount) || 3;


    /*
        Смена текущей недели
    */

    let currentShiftId =
        savedSettings.currentShiftId || "morning";


    /*
        ==========================================
        ТЕКУЩАЯ ДАТА
        ==========================================
    */

    let currentDate = new Date();

    const today = new Date();


    /*
        ==========================================
        ПОНЕДЕЛЬНИК НЕДЕЛИ
        ==========================================
    */

    function getMonday(date) {

        const result =
            new Date(date);

        const day =
            result.getDay();

        const difference =
            day === 0
                ? -6
                : 1 - day;

        result.setDate(
            result.getDate() + difference
        );

        result.setHours(
            0,
            0,
            0,
            0
        );

        return result;
    }


    /*
        ==========================================
        ПОНЕДЕЛЬНИК ТЕКУЩЕЙ НЕДЕЛИ
        ==========================================
    */

    const currentWeek =
        getMonday(today);


    /*
        ==========================================
        РАЗНИЦА МЕЖДУ НЕДЕЛЯМИ
        ==========================================
    */

    function getWeekDifference(
        firstWeek,
        secondWeek
    ) {

        const difference =
            firstWeek.getTime() -
            secondWeek.getTime();

        return Math.round(
            difference /
            (1000 * 60 * 60 * 24 * 7)
        );

    }


    /*
        ==========================================
        СМЕНА ДЛЯ КОНКРЕТНОЙ ДАТЫ
        ==========================================
    */

    function getShiftForDate(date) {

        const set =
            shiftSets[shiftCount];


        /*
            Индекс выбранной текущей смены
        */

        const currentShiftIndex =
            set.findIndex(
                shift =>
                    shift.id === currentShiftId
            );


        const anchorIndex =
            currentShiftIndex >= 0
                ? currentShiftIndex
                : 0;


        /*
            Понедельник недели
        */

        const week =
            getMonday(date);


        /*
            Разница в неделях относительно
            текущей недели
        */

        const weekDifference =
            getWeekDifference(
                week,
                currentWeek
            );


        /*
            Определяем смену.

            Например, 2 смены:

            текущая       Утренняя
            +1 неделя    Обеденная
            +2 недели    Утренняя
            +3 недели    Обеденная

            И наоборот для прошлых недель.
        */

        const shiftIndex =
            (
                anchorIndex +
                weekDifference
            ) % set.length;


        /*
            Исправляем отрицательный индекс
        */

        const normalizedIndex =
            (
                shiftIndex +
                set.length
            ) % set.length;


        return set[normalizedIndex];

    }


    /*
        ==========================================
        ЗАПОЛНЯЕМ SELECT
        ==========================================
    */

    function fillShiftSelect() {

        currentShiftSelect.innerHTML = "";


        const set =
            shiftSets[shiftCount];


        set.forEach(shift => {

            const option =
                document.createElement("option");

            option.value =
                shift.id;

            option.textContent =
                shift.name;

            currentShiftSelect.appendChild(
                option
            );

        });


        /*
            Если выбранной смены нет
            в новом режиме — берём первую.
        */

        const exists =
            set.some(
                shift =>
                    shift.id === currentShiftId
            );


        if (!exists) {

            currentShiftId =
                set[0].id;

        }


        currentShiftSelect.value =
            currentShiftId;

    }


    /*
        ==========================================
        СОХРАНЕНИЕ НАСТРОЕК
        ==========================================
    */

    function saveSettings() {

        localStorage.setItem(
            storageKey,
            JSON.stringify({
                shiftCount,
                currentShiftId
            })
        );

    }


    /*
        ==========================================
        ЛЕГЕНДА
        ==========================================
    */

    function renderLegend() {

        legend.innerHTML = "";


        const set =
            shiftSets[shiftCount];


        set.forEach(shift => {

            const item =
                document.createElement("div");

            item.className =
                "legend-item";


            const color =
                document.createElement("div");

            color.className =
                "legend-color";


            if (shift.id === "morning") {

                color.classList.add(
                    "legend-morning"
                );

            }

            if (shift.id === "night") {

                color.classList.add(
                    "legend-night"
                );

            }

            if (shift.id === "lunch") {

                color.classList.add(
                    "legend-lunch"
                );

            }


            item.appendChild(color);

            item.appendChild(
                document.createTextNode(
                    shift.name
                )
            );


            legend.appendChild(item);

        });

    }


    /*
        ==========================================
        ОТРИСОВКА КАЛЕНДАРЯ
        ==========================================
    */

    function renderCalendar() {

        const year =
            currentDate.getFullYear();

        const month =
            currentDate.getMonth();


        /*
            Название месяца
        */

        monthYear.textContent =
            `${months[month]} ${year}`;


        /*
            Очищаем календарь
        */

        daysContainer.innerHTML = "";


        /*
            Первый день месяца
        */

        let firstDay =
            new Date(
                year,
                month,
                1
            ).getDay();


        /*
            Понедельник — первый день недели
        */

        if (firstDay === 0) {

            firstDay = 7;

        }


        /*
            Количество дней месяца
        */

        const daysInMonth =
            new Date(
                year,
                month + 1,
                0
            ).getDate();


        /*
            Пустые клетки перед первым
            числом месяца.

            Даты предыдущего месяца
            здесь НЕ создаются.
        */

        for (
            let i = 1;
            i < firstDay;
            i++
        ) {

            const emptyDay =
                document.createElement("div");

            emptyDay.classList.add(
                "day"
            );

            daysContainer.appendChild(
                emptyDay
            );

        }


        /*
            Создаём только дни
            текущего месяца.
        */

        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const dayElement =
                document.createElement("div");


            dayElement.classList.add(
                "day"
            );


            dayElement.textContent =
                day;


            /*
                Полная дата
            */

            const date =
                new Date(
                    year,
                    month,
                    day
                );


            /*
                Получаем смену
                этой недели.
            */

            const shift =
                getShiftForDate(date);


            /*
                Цвет смены
            */

            dayElement.classList.add(
                shift.className
            );


            /*
                Сегодня
            */

            if (
                day === today.getDate() &&
                month === today.getMonth() &&
                year === today.getFullYear()
            ) {

                dayElement.classList.add(
                    "today"
                );

            }


            /*
                Название смены при наведении
            */

            dayElement.title =
                shift.name;


            daysContainer.appendChild(
                dayElement
            );

        }

    }


    /*
        ==========================================
        ИЗМЕНЕНИЕ КОЛИЧЕСТВА СМЕН
        ==========================================
    */

    shiftCountSelect.addEventListener(
        "change",
        () => {

            shiftCount =
                Number(
                    shiftCountSelect.value
                );


            /*
                Проверяем, существует ли
                выбранная смена в новом цикле.
            */

            const exists =
                shiftSets[shiftCount].some(
                    shift =>
                        shift.id === currentShiftId
                );


            /*
                В нашем случае при переходе
                3 → 2 Ночная исчезает,
                поэтому выбираем Утреннюю.
            */

            if (!exists) {

                currentShiftId =
                    "morning";

            }


            fillShiftSelect();

            renderLegend();

            saveSettings();

            renderCalendar();

        }
    );


    /*
        ==========================================
        ИЗМЕНЕНИЕ ТЕКУЩЕЙ СМЕНЫ
        ==========================================
    */

    currentShiftSelect.addEventListener(
        "change",
        () => {

            currentShiftId =
                currentShiftSelect.value;


            saveSettings();

            renderCalendar();

        }
    );


    /*
        ==========================================
        ПРЕДЫДУЩИЙ МЕСЯЦ
        ==========================================
    */

    prevButton.addEventListener(
        "click",
        () => {

            currentDate.setMonth(
                currentDate.getMonth() - 1
            );

            renderCalendar();

        }
    );


    /*
        ==========================================
        СЛЕДУЮЩИЙ МЕСЯЦ
        ==========================================
    */

    nextButton.addEventListener(
        "click",
        () => {

            currentDate.setMonth(
                currentDate.getMonth() + 1
            );

            renderCalendar();

        }
    );


    /*
        ==========================================
        ЗАПУСК
        ==========================================
    */

    shiftCountSelect.value =
        shiftCount;

    fillShiftSelect();

    renderLegend();

    renderCalendar();

</script>

</body>
</html>
